<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Alzikrayat{% endblock %} · Alzikrayat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="navbar navbar-expand-md">
  <div class="container">
    <a class="navbar-brand" href="/">alzikra<span>yat</span></a>
    <div class="d-flex align-items-center gap-3">
      <a class="nav-link d-none d-md-inline" href="/photos">Gallery</a>
      <a class="nav-link d-none d-md-inline" href="/#about">About</a>
      {% if session.user %}
        <a class="nav-link d-none d-md-inline" href="/photo/create">Upload</a>
        <span class="text-body-secondary small">Hi {{ session.user.first_name }}</span>
        <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
      {% else %}
        <span class="text-body-secondary small d-none d-sm-inline">Please login</span>
        <a href="/login" class="btn btn-primary btn-sm">Login</a>
      {% endif %}
    </div>
  </div>
</nav>

{% block content %}{% endblock %}

<footer class="py-4 mt-5">
  <div class="container d-flex justify-content-between small flex-wrap gap-2">
    <span>© {{ current_year }} Alzikrayat</span>
    <span>@SUST</span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
