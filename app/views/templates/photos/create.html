{% extends "base.html" %}
{% block title %}Upload{% endblock %}
{% block content %}

<div class="container py-5 d-flex justify-content-center">
  <div class="card p-4" style="max-width:480px;width:100%;">
    <h2 class="h4 mb-1">Add a photo</h2>
    <p class="text-body-secondary small mb-4">JPEG or PNG, up to 8MB.</p>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="alert alert-danger small py-2">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}

    <form id="uploadForm" action="{{ url_for('photo_store') }}" method="POST" enctype="multipart/form-data" class="needs-validation" novalidate>
      <div class="mb-3">
        <label class="form-label small" for="photoFile">Photo file</label>
        <input type="file" class="form-control" id="photoFile" name="photo" accept="image/png,image/jpeg" required>
        <div class="invalid-feedback">Please choose a JPEG or PNG file.</div>
      </div>
      <div class="mb-3">
        <label class="form-label small" for="title">Title</label>
        <input type="text" class="form-control" id="title" name="title" maxlength="200" required>
        <div class="invalid-feedback">Title is required.</div>
      </div>
      <div class="mb-3">
        <label class="form-label small" for="description">Description</label>
        <textarea class="form-control" id="description" name="description" rows="4" maxlength="1000" placeholder="Optional caption or story"></textarea>
      </div>
      <button type="submit" class="btn btn-primary w-100">Upload photo</button>
    </form>
  </div>
</div>

{% endblock %}
